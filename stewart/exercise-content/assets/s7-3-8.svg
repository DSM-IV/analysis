<svg xmlns="http://www.w3.org/2000/svg" width="540" height="340" viewBox="0 0 540 340"><rect width="540" height="340" fill="#f8fafc"/><g font-family="sans-serif" font-size="16"><text x="25" y="28">7.3.8 Substitution reference triangle</text><path d="M85,265 H370 V80 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M353,265 V248 H370" fill="none" stroke="#475569"/><text x="195" y="295">sqrt(2-x^2)</text><text x="380" y="177">|x|</text><text x="125" y="145">sqrt(2)</text><text x="112" y="253">alpha</text><text x="25" y="325">sin(theta)=x/sqrt(2); alpha is the acute reference angle.</text></g></svg>