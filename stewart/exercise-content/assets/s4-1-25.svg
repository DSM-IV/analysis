<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400"><rect width="700" height="400" fill="white"/><text x="30" y="25" font-size="15">Equal-width increments stack to height f(b)-f(a)</text><rect x="40" y="332" width="50" height="18" fill="#3679b1"/><text x="60" y="325" font-size="13">1</text><rect x="125" y="296" width="50" height="54" fill="#6ea95e"/><text x="145" y="289" font-size="13">3</text><rect x="210" y="260" width="50" height="90" fill="#d29744"/><text x="230" y="253" font-size="13">5</text><rect x="295" y="224" width="50" height="126" fill="#b16ca4"/><text x="315" y="217" font-size="13">7</text><rect x="540" y="332" width="50" height="18" fill="#3679b1"/><rect x="540" y="278" width="50" height="54" fill="#6ea95e"/><rect x="540" y="188" width="50" height="90" fill="#d29744"/><rect x="540" y="62" width="50" height="126" fill="#b16ca4"/><text x="385" y="210" font-size="30">→</text><text x="515" y="40" font-size="13">1+3+5+7=16</text><text x="40" y="380" font-size="13">Each strip has width Δx; total area = Δx [f(b)-f(a)].</text></svg>